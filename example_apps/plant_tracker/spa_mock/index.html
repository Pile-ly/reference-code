<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Waterly — plant care mock</title>
    <script>
      // Decide light/dark before first paint (no flash). A saved choice wins;
      // otherwise follow the device. The in-app toggle persists the override.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("waterly_theme");
          theme = saved === "dark" || saved === "light" ? saved : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
