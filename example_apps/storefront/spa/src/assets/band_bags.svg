<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img">
  <!-- Landing band art: heavy bags. Flat geometric "photo" so the demo is
       self-contained; a real deployment swaps these for photos (any static
       asset imported from src/config.ts works the same way). -->
  <rect width="800" height="520" fill="#33261a"/>
  <!-- back wall glow -->
  <ellipse cx="400" cy="240" rx="360" ry="200" fill="#3d2d1e" opacity="0.6"/>
  <!-- ceiling beam -->
  <rect x="0" y="36" width="800" height="18" rx="4" fill="#241a10"/>
  <!-- bag 1 -->
  <g>
    <line x1="200" y1="54" x2="200" y2="120" stroke="#191209" stroke-width="6"/>
    <rect x="152" y="118" width="96" height="240" rx="44" fill="#4a3722"/>
    <rect x="152" y="118" width="96" height="42" rx="21" fill="#241a10"/>
    <rect x="168" y="170" width="10" height="150" rx="5" fill="#5c4730" opacity="0.9"/>
    <ellipse cx="200" cy="420" rx="70" ry="14" fill="#241a10" opacity="0.55"/>
  </g>
  <!-- bag 2 (accent bag, foreground) -->
  <g>
    <line x1="400" y1="54" x2="400" y2="104" stroke="#191209" stroke-width="7"/>
    <rect x="344" y="102" width="112" height="286" rx="52" fill="#e04a1f"/>
    <rect x="344" y="102" width="112" height="48" rx="24" fill="#a33415"/>
    <rect x="362" y="162" width="12" height="180" rx="6" fill="#f0704a" opacity="0.85"/>
    <ellipse cx="400" cy="440" rx="84" ry="16" fill="#241a10" opacity="0.6"/>
  </g>
  <!-- bag 3 -->
  <g>
    <line x1="600" y1="54" x2="600" y2="132" stroke="#191209" stroke-width="6"/>
    <rect x="556" y="130" width="88" height="220" rx="40" fill="#57432b"/>
    <rect x="556" y="130" width="88" height="38" rx="19" fill="#241a10"/>
    <rect x="571" y="178" width="9" height="140" rx="4.5" fill="#6b5336" opacity="0.9"/>
    <ellipse cx="600" cy="412" rx="64" ry="13" fill="#241a10" opacity="0.55"/>
  </g>
  <!-- floor line -->
  <rect x="0" y="452" width="800" height="68" fill="#2a1f14"/>
</svg>
