[package]
name = "managed_server"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[[bin]]
name = "managed_server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unused by this reference app's own code — kept because it is part of the
# baseline dependency set every managed-server app is expected to carry,
# which the builder image's warm/Cargo.toml must match line for line. Do
# not remove it as dead weight without updating that file too.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
mimalloc = "0.1"

# Test-only. Never linked into the shipped binary, so it plays no part in
# reconciling this dependency set with the builder image's warm/Cargo.toml.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
