  <rect x="16" y="28" width="32" height="4" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="16" y="38" width="20" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
  <path d="M40 46 l10 -10 3 3 -10 10 -4 1z" fill="#ffffff"/>
</svg>
